# Secretless Code — Docker Compose Dev Override
# Mounts source code as live volumes for fast local iteration.
# Uses nodemon for backend auto-restart on file changes.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  backend:
    build:
      target: production  # reuse production image but with dev overrides
    environment:
      NODE_ENV: development
      CORS_ORIGIN: "*"
    volumes:
      - ./backend/src:/app/src:ro
    command: ["node", "--watch", "src/server.js"]

  frontend:
    build:
      target: deps  # use the deps stage (source not built yet)
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    volumes:
      - ./frontend:/app:rw
      - /app/node_modules  # anonymous volume so host node_modules doesn't shadow container's
      - /app/.next         # anonymous volume so Next.js build cache is persisted in container
    command: ["npm", "run", "dev"]
    depends_on:
      - backend
