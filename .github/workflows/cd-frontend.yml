# ──────────────────────────────────────────────────────────────────────────────
# CD Pipeline — Frontend (Vercel)
# Primary hosting platform.
#
# Behaviour:
#   - push to main    → production deploy
#   - pull_request    → preview deploy (unique URL per PR)
#   - workflow_dispatch → manual production re-deploy
#
# Required GitHub Secrets:
#   VERCEL_TOKEN       → vercel.com/account/tokens
#   VERCEL_ORG_ID      → `vercel link` locally → .vercel/project.json → orgId
#   VERCEL_PROJECT_ID  → same file → projectId
#   NEXT_PUBLIC_API_URL → your backend URL, e.g. https://api.secretless.example.com
# ──────────────────────────────────────────────────────────────────────────────

name: CD — Frontend (Vercel)

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/cd-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
  workflow_dispatch:

concurrency:
  group: cd-frontend-vercel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Vercel ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }} Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # needed to post preview URL comment on PR
    defaults:
      run:
        working-directory: frontend

    outputs:
      deploy-url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings & env
        run: |
          vercel pull --yes \
            --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: |
          vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://secretless-backend.onrender.com' }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt \
            ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed: $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = '${{ steps.deploy.outputs.url }}';
            const body = [
              '## 🚀 Vercel Preview Deployment',
              '',
              `| Key | Value |`,
              `|-----|-------|`,
              `| 🔗 Preview URL | ${deployUrl} |`,
              `| 📦 Commit | \`${{ github.sha }}\` |`,
              `| 👤 Author | @${{ github.actor }} |`,
              '',
              '*Powered by [Vercel](https://vercel.com) · [Secretless Code](https://github.com/zameernagaral/secretlessCode)*'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Job summary
        run: |
          ENV_LABEL="${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}"
          echo "## 🚀 Vercel ${ENV_LABEL} Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ steps.deploy.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${ENV_LABEL} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
