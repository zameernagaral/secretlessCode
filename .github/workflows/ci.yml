# ──────────────────────────────────────────────────────────────────────────────
# CI Pipeline — Secretless Code
# Triggers: every push & pull_request to main or any feature branch
#
# Jobs:
#   1. lint-backend   — ESLint + node syntax check
#   2. lint-frontend  — TypeScript type check + Next.js lint
#   3. security-scan  — Gitleaks secret scan on the repo itself
#   4. audit          — npm audit for known vulnerabilities
#   5. docker-build   — Validate both Dockerfiles build successfully
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ["main", "develop", "feature/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Backend Lint & Syntax Check ─────────────────────────────────────────
  lint-backend:
    name: 🔍 Backend — Lint & Syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Node.js syntax (all .js files)
        run: find src -name "*.js" | xargs -I{} node --check {}

      - name: Validate server starts without crash
        run: timeout 5 node src/server.js || true
        env:
          PORT: 4001
          NODE_ENV: test

  # ── 2. Frontend Type-Check & Lint ──────────────────────────────────────────
  lint-frontend:
    name: 🔍 Frontend — TypeScript & Next.js Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Next.js lint
        run: npm run lint || true  # warn only; adjust to 'run: npm run lint' to enforce

  # ── 3. Secret Scanning (Gitleaks) ──────────────────────────────────────────
  security-scan:
    name: 🛡️ Security — Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for complete scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # optional: for org use

  # ── 4. Dependency Vulnerability Audit ──────────────────────────────────────
  audit:
    name: 🔒 Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || true

  # ── 5. Docker Build Validation ─────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker — Validate Builds
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend]  # only if lint passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: secretless-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: secretless-frontend:ci-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000
          cache-from: type=gha
          cache-to: type=gha,mode=max
