# ──────────────────────────────────────────────────────────────────────────────
# CD Pipeline — Frontend (Cloudflare Pages)
# Alternative to Vercel. Globally distributed, generous free tier.
#
# Uses @cloudflare/next-on-pages to compile Next.js for the CF Pages edge runtime.
#
# Behaviour:
#   - push to main    → production deploy
#   - pull_request    → preview deploy (unique URL per branch)
#   - workflow_dispatch → manual trigger
#
# Required GitHub Secrets:
#   CF_API_TOKEN          → Cloudflare API token with "Cloudflare Pages:Edit" permission
#                           Create at: https://dash.cloudflare.com/profile/api-tokens
#   CF_ACCOUNT_ID         → Cloudflare account ID (shown in dashboard sidebar URL)
#   NEXT_PUBLIC_API_URL   → Your backend URL
# ──────────────────────────────────────────────────────────────────────────────

name: CD — Frontend (Cloudflare Pages)

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/cd-frontend-cf.yml"
  pull_request:
    paths:
      - "frontend/**"
  workflow_dispatch:

concurrency:
  group: cd-frontend-cf-${{ github.ref }}
  cancel-in-progress: false

env:
  CF_PAGES_PROJECT: secretless-code   # Your Cloudflare Pages project name

jobs:
  build-and-deploy:
    name: ☁️ Cloudflare Pages ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }} Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: frontend

    outputs:
      deploy-url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Install @cloudflare/next-on-pages
        run: npm install --save-dev @cloudflare/next-on-pages

      - name: Build for Cloudflare Pages edge runtime
        run: npx @cloudflare/next-on-pages
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://secretless-backend.onrender.com' }}
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: >
            pages deploy .vercel/output/static
            --project-name=${{ env.CF_PAGES_PROJECT }}
            ${{ github.ref == 'refs/heads/main' && '--branch=main' || format('--branch={0}', github.head_ref || github.ref_name) }}

      - name: Extract deploy URL
        id: extract-url
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "url=https://${{ env.CF_PAGES_PROJECT }}.pages.dev" >> $GITHUB_OUTPUT
          else
            SAFE_BRANCH=$(echo "${{ github.head_ref || github.ref_name }}" | sed 's/[^a-zA-Z0-9-]/-/g' | cut -c1-28)
            echo "url=https://${SAFE_BRANCH}.${{ env.CF_PAGES_PROJECT }}.pages.dev" >> $GITHUB_OUTPUT
          fi

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const deployUrl = '${{ steps.extract-url.outputs.url }}';
            const body = [
              '## ☁️ Cloudflare Pages Preview Deployment',
              '',
              `| Key | Value |`,
              `|-----|-------|`,
              `| 🔗 Preview URL | ${deployUrl} |`,
              `| 📦 Commit | \`${{ github.sha }}\` |`,
              `| 👤 Author | @${{ github.actor }} |`,
              '',
              '*Powered by [Cloudflare Pages](https://pages.cloudflare.com) · [Secretless Code](https://github.com/zameernagaral/secretlessCode)*'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Job summary
        run: |
          ENV_LABEL="${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}"
          echo "## ☁️ Cloudflare Pages ${ENV_LABEL} Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ steps.extract-url.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${ENV_LABEL} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
