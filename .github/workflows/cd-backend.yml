# ──────────────────────────────────────────────────────────────────────────────
# CD Pipeline — Backend (Express + Gitleaks)
# Triggers: push to main only (after CI passes)
#
# Flow:
#   1. Build multi-stage Docker image (Go Gitleaks + Node.js)
#   2. Push to GitHub Container Registry (ghcr.io)
#   3. Trigger Render redeploy via Deploy Hook URL
# ──────────────────────────────────────────────────────────────────────────────

name: CD — Backend Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/cd-backend.yml"

  workflow_dispatch:  # Allow manual trigger from Actions tab

concurrency:
  group: cd-backend
  cancel-in-progress: false  # never cancel an in-flight backend deploy

jobs:
  build-and-push:
    name: 🐳 Build & Push Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # needed to push to ghcr.io

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build & Push backend image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log pushed image digest
        run: echo "Pushed image digest → ${{ steps.build.outputs.digest }}"

  deploy-render:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production  # requires manual approval if configured in repo settings

    steps:
      - name: Trigger Render Deploy Hook
        # Set RENDER_DEPLOY_HOOK_URL in: Settings → Secrets → Actions
        # Get it from: Render dashboard → Your service → Settings → Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          echo "Triggering Render deployment..."
          curl -s -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            || echo "Warning: Render deploy hook returned non-2xx. Check Render dashboard."

      - name: Skip deploy (no hook configured)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "ℹ️ RENDER_DEPLOY_HOOK_URL secret not set."
          echo "   Add it in: GitHub repo → Settings → Secrets → Actions → RENDER_DEPLOY_HOOK_URL"

      - name: Deployment summary
        run: |
          echo "## 🚀 Backend Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`ghcr.io/${{ github.repository }}/backend:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Digest | \`${{ needs.build-and-push.outputs.image-digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
